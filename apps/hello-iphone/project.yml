name: FactoryHello
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: 1.0.1
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  FactoryHello:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aifactory.helloiphone.a7e4c921
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_CFBundleDisplayName: Factory Hello
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  FactoryHelloTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: FactoryHello
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aifactory.helloiphone.a7e4c921.tests
        GENERATE_INFOPLIST_FILE: 'YES'
  FactoryHelloUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: FactoryHello
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aifactory.helloiphone.a7e4c921.uitests
        GENERATE_INFOPLIST_FILE: 'YES'
schemes:
  FactoryHello:
    build:
      targets:
        FactoryHello: all
    test:
      gatherCoverageData: true
      targets:
        - FactoryHelloTests
        - FactoryHelloUITests
